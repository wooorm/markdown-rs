[[bench]]
harness = false
name = "bench"
path = "benches/bench.rs"

[dependencies]
bytes-str = "0.2.7"
log = { optional = true, version = "0.4.28" }
serde = { features = ["derive"], optional = true, version = "1.0.228" }
unicode-id = { features = ["no_std"], version = "0.3.6" }

[dev-dependencies]
criterion = "0.7.0"
env_logger = "0.11"
pretty_assertions = { workspace = true }
serde_json = "1.0.145"
swc_core = { version = "44.0.2", features = ["common", "ecma_ast", "ecma_parser", "ecma_visit"] }

[features]
default = []
json = ["serde"]
log = ["dep:log"]
serde = ["dep:serde"]

[package]
authors = ["Titus Wormer <tituswormer@gmail.com>"]
categories = ["compilers", "encoding", "parser-implementations", "parsing", "text-processing"]
description = "CommonMark compliant markdown parser in Rust with ASTs and extensions"
edition = "2024"
homepage = "https://github.com/wooorm/markdown-rs"
include = ["src/", "license"]
keywords = ["commonmark", "markdown", "parse", "render", "tokenize"]
license = "MIT"
name = "markdown"
repository = "https://github.com/wooorm/markdown-rs"
rust-version = "1.90.0"
version = "1.1.0"

[workspace]
members = ["generate", "mdast_util_to_markdown"]

[workspace.dependencies]
pretty_assertions = "1"
